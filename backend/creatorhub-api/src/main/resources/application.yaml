server:
  address: ${CREATORHUB_BIND_ADDRESS:127.0.0.1}
  port: ${CREATORHUB_PORT:8080}

spring:
  config:
    import: classpath:creatorhub-redis.yaml
  application:
    name: creatorhub-api
  datasource:
    url: ${CREATORHUB_DB_URL:jdbc:mysql://127.0.0.1:3306/creatorhub?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${CREATORHUB_DB_USER:creatorhub}
    password: ${MYSQL_APP_PASSWORD}
  flyway:
    baseline-on-migrate: ${CREATORHUB_DB_BASELINE_ON_MIGRATE:false}
    baseline-version: '0'
    fail-on-missing-locations: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  session:
    timeout: ${CREATORHUB_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: ${CREATORHUB_SESSION_NAMESPACE:creatorhub:session}
        flush-mode: immediate

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

creatorhub:
  social:
    follow-cache:
      enabled: ${CREATORHUB_FOLLOW_CACHE_ENABLED:false}
      host: ${CREATORHUB_FOLLOW_CACHE_HOST:${spring.data.redis.host}}
      port: ${CREATORHUB_FOLLOW_CACHE_PORT:${spring.data.redis.port}}
      timeout: ${CREATORHUB_FOLLOW_CACHE_TIMEOUT:100ms}
      namespace: ${CREATORHUB_FOLLOW_CACHE_NAMESPACE:v1}
  identity:
    secure-cookie: ${CREATORHUB_SECURE_COOKIE:false}

logging:
  level:
    # MyBatis can include SQL parameters and result rows at DEBUG/TRACE.
    com.creatorhub.core.content.mapper.DraftMapper: 'OFF'
